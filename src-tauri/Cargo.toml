[package]
name = "tyset"
version = "0.1.0"
description = "A minimal WYSIWYG markdown editor"
authors = ["Kim Trønnes"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "tyset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
notify = "8.2"
arboard = "3.6"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
