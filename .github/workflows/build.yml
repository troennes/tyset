# Test and build Tyset on Linux (.deb) and Windows (NSIS installer).
# Every push builds downloadable workflow artifacts.
# Pushing a tag like v0.2.0 also creates a draft GitHub release with both installers.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # creating releases on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04 to match the WebKitGTK the app is tested against; the .deb
          # needs Ubuntu 24.04 or newer (or another distro with glibc >= 2.39).
          - os: ubuntu-24.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Test
        run: |
          npx tsc
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: true
          # Only tag pushes create a (draft) release; other builds just upload artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Tyset ${{ github.ref_name }}
          releaseDraft: true
