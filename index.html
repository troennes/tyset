<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tyset</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="full-height" id="sidebar">
        <header class="repel">
          <strong id="folder-name">No folder</strong>
          <button class="tertiary small" id="open-folder" title="Open folder (Ctrl+Shift+O)">Open…</button>
        </header>
        <nav class="tabs" aria-label="Sidebar">
          <ul>
            <li><button type="button" data-tab="files" aria-current="page">Files</button></li>
            <li><button type="button" data-tab="outline">Outline</button></li>
          </ul>
        </nav>
        <nav aria-label="Files" id="tree" data-panel="files"></nav>
        <nav aria-label="Outline" id="outline" data-panel="outline" hidden></nav>
      </aside>
      <main id="editor"></main>
      <div class="empty-state">
        <p>Open a folder <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd>, a file <kbd>Ctrl</kbd>+<kbd>O</kbd>,
          or create one <kbd>Ctrl</kbd>+<kbd>N</kbd>.</p>
      </div>
      <div class="status">
        <span class="cluster">
          <button type="button" class="tertiary small status-button" id="theme-toggle"></button>
          <span id="mode"></span>
        </span>
        <span class="cluster">
          <div class="dropdown" id="export" hidden>
            <button type="button" class="tertiary small status-button" popovertarget="export-menu">Export</button>
            <div id="export-menu" popover>
              <ul>
                <li><button type="button" data-export="html">HTML file… <kbd>Ctrl+Shift+E</kbd></button></li>
                <li><button type="button" data-export="pdf">Print or PDF… <kbd>Ctrl+P</kbd></button></li>
              </ul>
            </div>
          </div>
          <button type="button" class="tertiary small status-button" id="history-button" title="Earlier versions of this file" hidden>History</button>
          <span id="save-state" aria-live="polite"></span>
        </span>
      </div>
    </div>

    <dialog id="history" aria-labelledby="history-title">
      <header><strong id="history-title">History</strong></header>
      <div class="history-body">
        <ul id="history-list" aria-label="Versions"></ul>
        <pre id="history-preview"></pre>
      </div>
      <footer>
        <form method="dialog" class="cluster" style="--cluster-horizontal-alignment: flex-end">
          <button class="secondary" value="cancel">Cancel</button>
          <button id="history-restore" value="restore">Restore this version</button>
        </form>
      </footer>
      <form method="dialog"><button class="close" aria-label="Close"></button></form>
    </dialog>
  </body>
</html>
